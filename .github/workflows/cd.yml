name: CD

on:
  push:
    branches: [master]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY: ${{ secrets.ARTIFACT_REGISTRY }}
  REPO: movies-repo
  CLUSTER: ${{ secrets.GKE_CLUSTER }}
  ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ingress.yaml

      - name: Create secrets
        run: |
          kubectl create secret generic postgres-secret \
            --namespace=movies-recommendation \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic backend-secret \
            --namespace=movies-recommendation \
            --from-literal=DATABASE_URL="postgresql://movies_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/movies_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/movies-backend:${{ github.sha }}"
          kubectl set image deployment/backend backend="${IMAGE}" \
            --namespace=movies-recommendation

      - name: Deploy frontend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/movies-frontend:${{ github.sha }}"
          kubectl set image deployment/frontend frontend="${IMAGE}" \
            --namespace=movies-recommendation

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n movies-recommendation --timeout=600s
          kubectl rollout status deployment/frontend -n movies-recommendation --timeout=300s
